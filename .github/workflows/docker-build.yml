name: Build Docker Image

on:
  push:
    branches: ["main"]
  pull_request:

# Lecture seule par défaut : les droits d'écriture sont accordés job par job
permissions:
  contents: read

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:

  tests:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Même version que l'image Docker
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  lint-commit:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      # ✅ IMPORTANT : récupérer tout l'historique
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'
          
      # ✅ Commitlint officiel : un commit non conforme fait échouer le pipeline
      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6
        with:
          # configFile: commitlint.config.js
          failOnErrors: true
          failOnWarnings: false

  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    needs: [tests, lint-commit]
    # ⚡ release uniquement sur un push sur main, après tests et commitlint réussis
    if: github.event_name == 'push'
    permissions:
      contents: write        # nécessaire pour créer un tag
      pull-requests: write   # nécessaire pour semantic release
      issues: write          # nécessaire pour semantic release
    outputs:
      next_version: ${{ steps.get_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'

      - name: Install semantic-release deps
        run: |
          npm install \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github \
            conventional-changelog-conventionalcommits

      - name: Check if release is needed
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          OUTPUT=$(npx semantic-release --dry-run --debug 2>&1 | tee /dev/stderr)
      
          if echo "$OUTPUT" | grep -q "The next release version is"; then
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Run Semantic Release
        if: steps.check_release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
  
      - name: Get latest release tag
        if: steps.check_release.outputs.released == 'true'
        id: get_tag
        run: |
          git fetch --tags
          # Récupère le dernier tag Git créé par semantic-release
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$TAG" ]; then
            echo "No new release tag found. Skipping Docker build."
            echo "tag=" >> $GITHUB_OUTPUT
          else
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "Latest release tag: $TAG"
          fi

  docker-build:
    name: Build and Tag Docker
    runs-on: ubuntu-latest
    needs: calculate-version
    if: ${{ needs.calculate-version.outputs.next_version != '' }}  # ⚡ ne run que si un tag existe
    permissions:
      contents: read
      packages: write        # nécessaire pour push vers ghcr
    steps:
      - name: Debug version
        run: |
          echo "Next version: '${{ needs.calculate-version.outputs.next_version }}'"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # IMPORTANT pour récupérer les tags
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set lowercase image name
        id: image
        run: |
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> $GITHUB_OUTPUT

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.image }}:${{ needs.calculate-version.outputs.next_version }}
          build-args: |
            APP_VERSION=${{ needs.calculate-version.outputs.next_version }}
