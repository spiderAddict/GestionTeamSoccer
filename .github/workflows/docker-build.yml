name: Build Docker Image

on:
  push:
    branches: ["main"]

permissions:
  contents: write        # nécessaire pour créer un tag
  packages: write        # nécessaire pour push vers ghcr
  
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-commit:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      # ✅ IMPORTANT : récupérer tout l'historique
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      # ✅ Commitlint officiel
      - name: Lint commits
        uses: wagoid/commitlint-github-action@v5

  docker-build:
    name: Build and Tag Docker
    runs-on: ubuntu-latest
    needs: lint-commit
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0   # IMPORTANT pour récupérer les tags
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      # 🔢 Calcul version
      - name: Calculate new version
        id: get_version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "Last tag: $LAST_TAG"

          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit: $COMMIT_MSG"

          MAJOR=$(echo $LAST_TAG | cut -d. -f1)
          MINOR=$(echo $LAST_TAG | cut -d. -f2)
          PATCH=$(echo $LAST_TAG | cut -d. -f3)

          if [[ $COMMIT_MSG == feat* ]]; then
            MINOR=$((MINOR+1))
            PATCH=0
          elif [[ $COMMIT_MSG == fix* ]]; then
            PATCH=$((PATCH+1))
          else
            PATCH=$((PATCH+1))
          fi

          NEW_TAG="$MAJOR.$MINOR.$PATCH"
          echo "New tag: $NEW_TAG"

          echo "version=$NEW_TAG" >> $GITHUB_OUTPUT

      # 🏷️ Créer et push le tag Git
      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.get_version.outputs.version }}
          git push origin ${{ steps.get_version.outputs.version }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}
