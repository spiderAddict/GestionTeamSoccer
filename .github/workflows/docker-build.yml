name: Build Docker Image

on:
  push:
    branches: ["main"]

permissions:
  contents: write        # nécessaire pour créer un tag
  packages: write        # nécessaire pour push vers ghcr
  
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:

  lint-commit:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      # ✅ IMPORTANT : récupérer tout l'historique
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      # ✅ Commitlint officiel
      - name: Lint commits
        uses: wagoid/commitlint-github-action@v5
        with:
          # configFile: commitlint.config.js
          failOnErrors: true   # ❌ stoppe le workflow
          failOnWarnings: false # ⚠️ warnings ne stoppent pas le workflow

  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    needs: lint-commit
    outputs:
      next_version: ${{ steps.get_version.outputs.version }}  # <-- expose comme output du job    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install Semantic Release
        run: npm install semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github --no-save
      - name: Get next version
        id: get_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT_VERSION=$(npx semantic-release --dry-run --no-ci 2>&1 | grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+')
          echo "Next version: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

  docker-build:
    name: Build and Tag Docker
    runs-on: ubuntu-latest
    needs: calculate-version
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0   # IMPORTANT pour récupérer les tags
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2        

      # 🏷️ Créer et push le tag Git
      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ needs.calculate-version.outputs.next_version }}
          git push origin ${{ needs.calculate-version.outputs.next_version }}

      - name: Set lowercase image name
        id: image
        run: |
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> $GITHUB_OUTPUT

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.image }}:${{ needs.calculate-version.outputs.next_version }}
