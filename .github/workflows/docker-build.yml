name: Build Docker Image

on:
  push:
    branches: ["main"]

permissions:
  contents: write        # nécessaire pour créer un tag
  packages: write        # nécessaire pour push vers ghcr
  pull-requests: write   # nécessaire pour semantic release
  issues: write          # nécessaire pour semantic release
  
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:

  lint-commit:
    name: Commit Lint
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.result.outputs.valid }}
    steps:
      # ✅ IMPORTANT : récupérer tout l'historique
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      # ✅ Commitlint officiel
      - name: Lint commits
        id: commitlint
        continue-on-error: true
        uses: wagoid/commitlint-github-action@v5
        with:
          # configFile: commitlint.config.js
          failOnErrors: true
          failOnWarnings: false
      
      - name: Set output
        id: result
        run: |
          if [ "${{ steps.commitlint.outcome }}" = "success" ]; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    needs: lint-commit
    if: needs.lint-commit.outputs.valid == 'true' # ⚡ ne run que si commitlint est passé
    outputs:
      next_version: ${{ steps.get_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install semantic-release deps
        run: npm install semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github

      - name: Check if release is needed
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(npx semantic-release --dry-run 2>&1)
      
          if echo "$OUTPUT" | grep -q "The next release version is"; then
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Run Semantic Release
        if: steps.check_release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
  
      - name: Get latest release tag
        if: steps.check_release.outputs.released == 'true'
        id: get_tag
        run: |
          git fetch --tags
          # Récupère le dernier tag Git créé par semantic-release
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$TAG" ]; then
            echo "No new release tag found. Skipping Docker build."
            echo "tag=" >> $GITHUB_OUTPUT
          else
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "Latest release tag: $TAG"
          fi

  docker-build:
    name: Build and Tag Docker
    runs-on: ubuntu-latest
    needs: calculate-version
    if: ${{ needs.calculate-version.outputs.next_version != '' }}  # ⚡ ne run que si un tag existe
    steps:
      - name: Debug version
        run: |
          echo "Next version: '${{ needs.calculate-version.outputs.next_version }}'"
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0   # IMPORTANT pour récupérer les tags
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Set lowercase image name
        id: image
        run: |
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> $GITHUB_OUTPUT

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.image }}:${{ needs.calculate-version.outputs.next_version }}
          build-args: |
            APP_VERSION=${{ needs.calculate-version.outputs.next_version }}
