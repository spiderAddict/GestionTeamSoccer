<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion des matchs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>

<section class="section">
  <div class="container">
    <h1 class="title">Matchs</h1>

    <!-- Bouton ouverture modal -->
    <button class="button is-primary" onclick="openMatchModal()">
      Ajouter un match
    </button>

    <hr>

    <!-- Liste des matchs -->
    <table class="table is-fullwidth is-striped">
      <thead>
        <tr>
          <th>Date</th>
          <th>Joueurs</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="matchesTable"></tbody>
    </table>
  </div>
</section>

<!-- Modal -->
<div class="modal" id="matchModal">
  <div class="modal-background" onclick="closeMatchModal()"></div>
  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title">Match</p>
      <button class="delete" onclick="closeMatchModal()"></button>
    </header>

    <section class="modal-card-body">

      <div class="field">
        <label class="label">Date</label>
        <div class="control">
          <input id="matchDate" class="input" type="date">
        </div>
      </div>

      <div class="field">
        <label class="label">Joueurs</label>
        <div id="playersCheckboxes"></div>
      </div>

    </section>

    <footer class="modal-card-foot">
      <button class="button is-success" onclick="saveMatch()">Sauvegarder</button>
      <button class="button" onclick="closeMatchModal()">Annuler</button>
    </footer>
  </div>
</div>

<script>
let players = [
  { id: 1, name: "Jean Dupont" },
  { id: 2, name: "Lucas Martin" }
];

let matches = [];

function renderMatches() {
  const tbody = document.getElementById("matchesTable");
  tbody.innerHTML = "";

  matches.forEach(match => {
    const playerNames = match.players
      .map(id => players.find(p => p.id === id)?.name)
      .join(", ");

    tbody.innerHTML += `
      <tr>
        <td>${match.date}</td>
        <td>${playerNames}</td>
        <td>
          <button class="button is-danger is-light"
            onclick="deleteMatch(${match.id})">
            Supprimer
          </button>
        </td>
      </tr>
    `;
  });
}

function openMatchModal() {
  document.getElementById("matchModal").classList.add("is-active");
  renderPlayerCheckboxes();
}

function closeMatchModal() {
  document.getElementById("matchModal").classList.remove("is-active");
}

function renderPlayerCheckboxes(selected = []) {
  const container = document.getElementById("playersCheckboxes");
  container.innerHTML = "";

  players.forEach(player => {
    container.innerHTML += `
      <div class="field">
        <label class="checkbox">
          <input type="checkbox"
            value="${player.id}"
            ${selected.includes(player.id) ? "checked" : ""}>
          ${player.name}
        </label>
      </div>
    `;
  });
}

function saveMatch() {
  const date = document.getElementById("matchDate").value;
  const checkboxes = document.querySelectorAll("#playersCheckboxes input:checked");

  const selectedPlayers = Array.from(checkboxes)
    .map(cb => parseInt(cb.value));

  matches.push({
    id: Date.now(),
    date,
    players: selectedPlayers
  });

  closeMatchModal();
  renderMatches();
}

function deleteMatch(id) {
  matches = matches.filter(m => m.id !== id);
  renderMatches();
}

renderMatches();
</script>

</body>
</html>
